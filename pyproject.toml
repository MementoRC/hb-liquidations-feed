[project]
name = "hb-liquidations-feed"
dynamic = ["version"]
description = "A modular liquidations data feed for cryptocurrency exchange monitoring"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "aiohttp>=3.8.0",
    "hb-logger @ git+https://github.com/MementoRC/hb-logger.git@06534b7708a13b4425a06dd154976db96c2c45be",
    "pandas>=1.0.0",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "liquidations_feed/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["liquidations_feed"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
aiohttp = ">=3.8.0"
pandas = ">=1.0.0"
pydantic = ">=2"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"
pytest-timeout = ">=2.1.0"
pytest-xdist = ">=3.0.0"
ruff = ">=0.1.6"
mypy = ">=1.5.1"
aioresponses = "*"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.1.6"
mypy = ">=1.5.1"
pytest = ">=7.0.0"
pytest-cov = ">=4.1.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
types-setuptools = "*"

[tool.pixi.feature.quality-extended.dependencies]
bandit = ">=1.8.0"
pip-audit = "*"
filelock = "*"

[tool.pixi.feature.quality-extended.tasks]
security-scan = "bandit -c pyproject.toml -r liquidations_feed/"
safety-check = "pip-audit"

[tool.pixi.feature.quality-ci.dependencies]
python-build = "*"
hatchling = "*"

[tool.pixi.feature.quality-ci.tasks]
build = "python -m build"

# Python version features
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-extended = { features = ["quality-extended"], solve-group = "default" }
quality-ci = { features = ["quality-ci"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
lint = "ruff check liquidations_feed tests"
format = "ruff format liquidations_feed tests"
format-check = "ruff format --check liquidations_feed tests"
typecheck = "mypy liquidations_feed"
type-check = "mypy liquidations_feed"
security = "bandit -c pyproject.toml -r liquidations_feed/"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long - handled by formatter
    "F401",  # unused imports - we'll address these gradually
]
unfixable = ["F401"]  # unused imports - let the developer decide

[tool.ruff.lint.isort]
known-first-party = ["liquidations_feed"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests",
    "asyncio: marks tests as asyncio tests",
    "live: marks tests that hit real exchange APIs (deselect with '-m \"not live\"')",
]
log_cli = true
log_cli_level = "DEBUG"
# Timeout settings (CI-friendly, can be overridden by --timeout flag)
timeout = 300
timeout_method = "thread"
# CI performance optimizations
addopts = "--strict-markers --strict-config"
minversion = "7.0"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["liquidations_feed", "tests"]
omit = [
  "liquidations_feed/__about__.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# Hummingbot sub-package supersession metadata.
# Declares which hummingbot module this sub-package replaces, enabling automated
# compatibility checking and test-skipping in hummingbot CI when this package is installed.
[tool.hummingbot.supersedes]
module = "hummingbot.data_feed.liquidations_feed"
import_path = "liquidations_feed.hb_compat"
factory_class = "LiquidationsFactory"
config_class = "LiquidationsConfig"
# Hummingbot test paths that this sub-package replaces.
# When this package is importable, these tests are auto-skipped in CI.
test_paths = ["test/hummingbot/data_feed/liquidations_feed"]
# Only skip tests for exchanges/modules with adapters in this sub-package.
# Tests for HB-only modules keep running unconditionally.
connectors = [
    "binance_perpetual",
]
